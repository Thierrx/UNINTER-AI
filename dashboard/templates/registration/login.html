
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNINTER AI | Login</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #080d18;
            color: white;
            font-family: Arial, sans-serif;
        }

        .login {
            width: 90%;
            max-width: 380px;
            padding: 35px;
            background: #111a2b;
            border: 1px solid #263650;
            border-radius: 18px;
        }

        h1 { text-align: center; margin-bottom: 8px; }
        p { text-align: center; color: #9baac0; }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: 1px solid #34445e;
            border-radius: 8px;
            background: #080d18;
            color: white;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #3978f6;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .erro { color: #ff7777; }
    </style>
</head>
<body>
    <div class="login">
        <h1>UNINTER AI</h1>
        <p>Acesse seu ambiente privado</p>

        {% if form.errors %}
            <p class="erro">Usuário ou senha incorretos.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <input type="text" name="username"
                   placeholder="Usuário" required>

            <input type="password" name="password"
                   placeholder="Senha" required>

            <input type="hidden" name="next" value="/">

            <button type="submit">ENTRAR</button>
        </form>
    </div>
</body>
</html>
